<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Clock</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%2307101f"/><rect x="14" y="14" width="36" height="36" rx="18" fill="%2338bdf8"/><rect x="20" y="20" width="10" height="8" fill="%23f1f5f9"/><rect x="34" y="18" width="8" height="10" fill="%23f1f5f9"/><rect x="24" y="36" width="18" height="8" fill="%23f1f5f9"/><rect x="31" y="18" width="4" height="16" fill="%2307101f"/><rect x="31" y="31" width="14" height="4" fill="%2307101f"/><rect x="29" y="29" width="8" height="8" fill="%2307101f"/><rect x="31" y="31" width="4" height="4" fill="%23fbbf24"/></svg>' />
  <style>
    :root {
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --time-grad: linear-gradient(135deg, #ffffff, var(--accent));
    }

    body[data-theme="light"] {
      --text: #0f172a;
      --muted: #475569;
      --card: rgba(15, 23, 42, 0.045);
      --border: rgba(15, 23, 42, 0.12);
      --time-grad: linear-gradient(135deg, #0369a1, #0ea5e9);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      position: relative;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      display: grid;
      place-items: center;
      justify-content: center;
      padding: 72px 24px 40px;
      overflow-x: hidden;
      transition: color 0.6s ease;
    }

    .app {
      width: min(1180px, 100%);
      min-height: min(720px, calc(100vh - 112px));
      display: grid;
      grid-template-columns: minmax(420px, 1.08fr) minmax(360px, 0.92fr);
      gap: clamp(36px, 6vw, 72px);
      align-items: center;
    }

    .panel {
      position: relative;
      overflow: visible;
      background: transparent;
      border: 0;
      border-radius: 0;
      backdrop-filter: none;
      box-shadow: none;
    }

    body[data-theme="light"] .panel {
      background: transparent;
      box-shadow: none;
    }

    .left-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .right-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .section-title small {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .section-title span {
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }

    .inline-button {
      font-family: inherit;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .inline-button:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .app.world-hidden {
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      transform: translateY(-5vh);
    }

    .app.world-hidden .left-panel {
      width: min(920px, 100%);
    }

    .app.world-hidden .greeting {
      font-size: clamp(2.05rem, 3.8vw, 2.9rem);
    }

    .app.world-hidden .city-visual {
      width: clamp(320px, 36vw, 500px);
      height: clamp(290px, 33vw, 440px);
    }

    .app.world-hidden .local .time {
      font-size: clamp(4.4rem, 8.4vw, 8rem);
    }

    .app.world-hidden .daily-quote {
      max-width: min(58vw, 620px);
    }

    .app.world-hidden .right-panel {
      display: none;
    }

    /* 随时间变化的天空背景 */
    #sky {
      position: fixed;
      inset: 0;
      z-index: -2;
      transition: background 2s ease;
    }

    /* 星空层 */
    #stars {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      transition: opacity 2s ease;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    @keyframes twinkle {
      from { opacity: 0.15; transform: scale(0.7); }
      to   { opacity: 1;    transform: scale(1.3); }
    }

    /* 顶部控制按钮 */
    .controls {
      position: fixed;
      top: 18px;
      right: 18px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .controls button {
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      min-width: 96px;
      padding: 8px 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .controls button:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .greeting {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.24em;
      font-size: clamp(1.95rem, 3.5vw, 2.7rem);
      font-weight: 720;
      line-height: 1.15;
      letter-spacing: 0;
      text-align: center;
      white-space: nowrap;
      max-width: 100%;
    }

    .greeting .emoji {
      margin-right: 0;
      transform: translateY(-0.03em);
    }

    .greeting-city {
      color: rgba(241, 245, 249, 0.92);
    }

    .local {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .local .label {
      display: none;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .local .time {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 0.14em;
      max-width: calc(100vw - 48px);
      padding-right: 0.08em;
      font-size: clamp(4.1rem, 7.8vw, 7.6rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      min-width: 5.45em;
      white-space: nowrap;
    }

    .time-digits {
      background: var(--time-grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ampm {
      display: inline-block;
      flex: 0 0 auto;
      white-space: nowrap;
      align-self: flex-end;
      margin-bottom: 0.16em;
      font-size: 0.22em;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: none;
      -webkit-background-clip: initial;
      background-clip: initial;
      -webkit-text-fill-color: var(--muted);
    }

    .local .date {
      margin-top: 14px;
      font-size: clamp(1.35rem, 1.9vw, 1.65rem);
      color: var(--muted);
    }

    .day-note {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(700px, 86vw);
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: -10px;
      padding: 0;
      opacity: 0.86;
    }

    .day-note-top {
      font-size: clamp(0.92rem, 1.15vw, 1.02rem);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .day-progress {
      position: relative;
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border-radius: 50%;
      background:
        conic-gradient(var(--accent) var(--progress, 0%), rgba(255, 255, 255, 0.12) 0),
        rgba(255, 255, 255, 0.04);
    }

    .day-progress-fill {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #0f2235;
      width: auto;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .daily-quote {
      max-width: min(46vw, 440px);
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(0.92rem, 1.15vw, 1.02rem);
      color: rgba(241, 245, 249, 0.68);
      white-space: nowrap;
    }

    .day-separator {
      color: rgba(148, 163, 184, 0.55);
    }

    .daily-quote a {
      color: inherit;
      text-decoration: none;
    }

    .daily-quote a:hover {
      color: var(--text);
    }

    .city-visual {
      position: relative;
      width: clamp(280px, 33vw, 430px);
      height: clamp(250px, 29vw, 380px);
      color: var(--text);
      filter: drop-shadow(0 24px 44px rgba(0, 0, 0, 0.34));
      image-rendering: pixelated;
      margin-top: -10px;
    }

    .city-visual svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      shape-rendering: crispEdges;
    }

    .pixel-shadow { fill: rgba(0, 0, 0, 0.22); }
    .pixel-dark { fill: rgba(7, 14, 28, 0.92); }
    .pixel-mid { fill: rgba(56, 189, 248, 0.32); }
    .pixel-bright { fill: rgba(56, 189, 248, 0.95); }
    .pixel-light { fill: rgba(241, 245, 249, 0.86); }
    .pixel-muted { fill: rgba(148, 163, 184, 0.72); }
    .pixel-hot { fill: rgba(251, 191, 36, 0.95); }
    .pixel-pink { fill: rgba(244, 114, 182, 0.9); }

    .mokugyo-body {
      animation: mokugyo-body 1s ease-in-out infinite;
      transform-origin: 50% 66%;
    }

    .mokugyo-mallet {
      animation: mokugyo-hit 1s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 160px 118px;
    }

    .mokugyo-ripple {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      opacity: 0;
      animation: mokugyo-ripple 1s ease-out infinite;
      transform-box: view-box;
      transform-origin: 110px 130px;
    }

    @keyframes mokugyo-hit {
      0%, 54%, 100% { transform: rotate(8deg); }
      66%           { transform: rotate(-34deg); }
      76%           { transform: rotate(-14deg); }
    }

    @keyframes mokugyo-body {
      0%, 63%, 100% { transform: scale(1); }
      67%           { transform: scale(1.025, 0.975); }
      76%           { transform: scale(0.99, 1.01); }
    }

    @keyframes mokugyo-ripple {
      0%, 64% { opacity: 0; transform: scale(0.48); }
      66%     { opacity: 0.48; transform: scale(0.62); }
      100%    { opacity: 0; transform: scale(1.42); }
    }

    .bigben-pendulum {
      animation: bigben-swing 2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 110px 76px;
    }

    .bigben-hand {
      animation: bigben-tick 1s steps(2, end) infinite;
      transform-box: view-box;
      transform-origin: 110px 50px;
    }

    @keyframes bigben-swing {
      0%, 100% { transform: rotate(-9deg); }
      50%      { transform: rotate(9deg); }
    }

    @keyframes bigben-tick {
      from { transform: rotate(0deg); }
      to   { transform: rotate(12deg); }
    }

    .torch-flame {
      animation: torch-flame 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .torch-beam {
      opacity: 0;
      animation: torch-beam 2.4s ease-out infinite;
      transform-box: view-box;
      transform-origin: 105px 60px;
    }

    @keyframes torch-flame {
      0%, 100% { transform: scale(0.96); opacity: 0.86; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    @keyframes torch-beam {
      0%   { opacity: 0.34; transform: scale(0.72); }
      100% { opacity: 0; transform: scale(1.45); }
    }

    .circuit-pulse {
      stroke-dasharray: 16 160;
      animation: circuit-flow 2s linear infinite;
    }

    .circuit-node {
      animation: circuit-node 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .circuit-node:nth-of-type(2) { animation-delay: 0.25s; }
    .circuit-node:nth-of-type(3) { animation-delay: 0.5s; }

    @keyframes circuit-flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -176; }
    }

    @keyframes circuit-node {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.35); }
    }

    .tokyo-scan {
      animation: tokyo-scan 2.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 110px 120px;
    }

    .tokyo-light {
      animation: tokyo-light 1.8s ease-in-out infinite alternate;
    }

    .brandenburg-scan {
      animation: brandenburg-scan 2.4s ease-in-out infinite;
    }

    .merlion-water {
      animation: merlion-water 0.9s linear infinite;
      transform-box: view-box;
    }

    .merlion-tail {
      animation: merlion-tail 2.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }

    .merlion-mane {
      animation: merlion-mane 1.8s ease-in-out infinite alternate;
    }

    @keyframes tokyo-scan {
      0%   { transform: translateY(42px); opacity: 0; }
      18%  { opacity: 0.7; }
      82%  { opacity: 0.7; }
      100% { transform: translateY(-48px); opacity: 0; }
    }

    @keyframes tokyo-light {
      from { opacity: 0.35; }
      to   { opacity: 0.95; }
    }

    @keyframes brandenburg-scan {
      0%   { transform: translateX(-36px); opacity: 0; }
      20%  { opacity: 0.9; }
      80%  { opacity: 0.9; }
      100% { transform: translateX(42px); opacity: 0; }
    }

    @keyframes merlion-water {
      from { transform: translateY(-10px); opacity: 0.35; }
      30%  { opacity: 1; }
      to   { transform: translateY(14px); opacity: 0.2; }
    }

    @keyframes merlion-tail {
      0%, 100% { transform: rotate(-2deg); }
      50%      { transform: rotate(3deg); }
    }

    @keyframes merlion-mane {
      from { opacity: 0.62; }
      to   { opacity: 1; }
    }

    /* 模拟表盘 */
    .clock {
      --size: clamp(250px, 28vw, 350px);
      position: relative;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, rgba(56, 189, 248, 0.14), transparent 60%),
        rgba(15, 23, 42, 0.55);
      border: 4px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(0, 0, 0, 0.4);
    }

    body[data-theme="light"] .clock {
      background:
        radial-gradient(circle at 50% 38%, rgba(56, 189, 248, 0.18), transparent 60%),
        rgba(255, 255, 255, 0.7);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 2px;
      height: 10px;
      background: var(--muted);
      transform-origin: 50% calc(var(--size) / 2 - 6px);
      transform: translateX(-50%) rotate(var(--rot));
    }

    .tick.hour { width: 4px; height: 16px; background: var(--text); }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 4px;
      transform: translateX(-50%) rotate(0deg);
    }

    .hand.hour   { width: 8px; height: 26%; background: var(--text); }
    .hand.minute { width: 6px; height: 36%; background: var(--text); }
    .hand.second { width: 2px; height: 42%; background: var(--accent); }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--accent);
    }

    .zones {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: none;
    }

    .city-manager {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .city-manager input {
      width: 100%;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      outline: none;
      backdrop-filter: blur(8px);
    }

    .city-manager input:focus {
      border-color: var(--accent);
    }

    .city-manager button,
    .card-action {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .city-manager button:hover,
    .card-action:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, border-color 0.2s ease, background 1.5s ease;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "city actions"
        "date time";
      align-items: end;
      column-gap: 18px;
      row-gap: 10px;
      cursor: grab;
      user-select: none;
    }

    /* 昼夜光晕 */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 0%, var(--glow, transparent), transparent 60%);
      opacity: 0.5;
      pointer-events: none;
      transition: background 1.5s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card:active {
      cursor: grabbing;
    }

    .card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

    .card.drag-over {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.45);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* 嵌在背景里的地标线描 */
    .bg-art {
      position: absolute;
      right: 8px;
      bottom: 0;
      width: 42%;
      height: 88%;
      color: var(--accent);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    .bg-art svg { width: 100%; height: 100%; }

    .card > .phase,
    .card > .card-actions,
    .card > .city,
    .card > .ctime,
    .card > .cdate { position: relative; z-index: 1; }

    .local-art {
      display: none;
    }
    .local-art svg { width: 100%; height: 100%; }

    .local > .label,
    .local > .day-note,
    .local > .city-visual,
    .local > div:last-child { position: relative; z-index: 1; }

    .card .phase {
      justify-self: end;
      font-size: 1.5rem;
      line-height: 1;
    }

    .card-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-self: end;
      gap: 8px;
    }

    .card-action {
      padding: 5px 9px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .card .city {
      grid-area: city;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .card .ctime {
      grid-area: time;
      justify-self: end;
      display: inline-flex;
      align-items: baseline;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 0.35em;
      padding-right: 0.06em;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      min-width: 7.7em;
      text-align: right;
      white-space: nowrap;
    }

    .card .ctime .ampm {
      margin-bottom: 0.1em;
      font-size: 0.38em;
    }

    .card .cdate {
      grid-area: date;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .visual-gallery {
      width: min(1180px, calc(100vw - 40px));
      padding: 42px 0;
      color: var(--text);
    }

    .visual-gallery h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    .visual-gallery p {
      margin-bottom: 28px;
      color: var(--muted);
    }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .visual-tile {
      min-height: 230px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(8px);
      display: grid;
      gap: 10px;
      justify-items: center;
      align-content: start;
    }

    .visual-tile .city-visual {
      width: 150px;
      height: 130px;
      margin: 0;
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.24));
    }

    .visual-city {
      font-weight: 700;
      text-align: center;
    }

    .visual-meta {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
    }

    @media (max-width: 900px) {
      body {
        padding: 88px 16px calc(96px + env(safe-area-inset-bottom));
      }

      .app {
        width: 100%;
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .app.world-hidden {
        transform: translateY(-2vh);
      }

      .app.world-hidden .greeting {
        width: min(100%, calc(100vw - 28px));

        font-size: clamp(1.25rem, 5.4vw, 1.7rem);
        white-space: normal;
        flex-wrap: wrap;
      }

      .app.world-hidden .city-visual {
        width: clamp(235px, 66vw, 315px);
        height: clamp(205px, 58vw, 280px);
      }

      .app.world-hidden .local .time {
        font-size: clamp(3.8rem, 18vw, 5.8rem);
      }

      .app.world-hidden .daily-quote {
        max-width: min(72vw, 340px);
        white-space: normal;
        line-height: 1.35;
      }

      .left-panel {
        width: 100%;
        align-items: center;
      }

      .greeting,
      .local {
        text-align: center;
      }

      .local {
        align-items: center;
        gap: 14px;
      }

      .greeting {
        max-width: calc(100vw - 28px);
        font-size: clamp(1.35rem, 5.4vw, 1.72rem);
        line-height: 1.1;
        white-space: normal;
        flex-wrap: wrap;
        row-gap: 4px;
      }

      .greeting-city {
        white-space: nowrap;
      }

      .day-note {
        max-width: calc(100vw - 34px);
        width: calc(100vw - 34px);
        flex-wrap: wrap;
        gap: 8px;
      }

      .daily-quote {
        max-width: min(72vw, 340px);
        white-space: normal;
        line-height: 1.35;
      }

      .city-visual {
        width: clamp(220px, 62vw, 300px);
        height: clamp(190px, 54vw, 265px);
      }

      .local .time {
        font-size: clamp(3.6rem, 17vw, 5.6rem);
        min-width: 0;
      }

      .local .date {
        margin-top: 8px;
        font-size: clamp(1.05rem, 4.8vw, 1.35rem);
      }

      .right-panel {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .controls {
        top: calc(12px + env(safe-area-inset-top));
        left: 12px;
        right: 12px;
        justify-content: center;
        gap: 8px;
      }

      .controls button {
        min-width: 0;
        padding: 7px 11px;
        font-size: 0.82rem;
      }

      .greeting,
      .app.world-hidden .greeting {
        position: relative;
        left: 50%;
        width: calc(100svw - 8px);
        max-width: calc(100svw - 8px);
        transform: translateX(-50%);
        box-sizing: border-box;
        font-size: clamp(1.18rem, 5.2vw, 1.55rem);

      .day-note,
      .app.world-hidden .day-note {
        width: calc(100vw - 28px);

  <script>
    let use12h = localStorage.getItem("wc-12h") === "1";
    let theme = localStorage.getItem("wc-theme") || "dark";
    let worldHidden = localStorage.getItem("wc-world-hidden") === "1";

    /* ---------- 时间格式化 ---------- */
    function formatTime(date, timeZone) {
      return new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: use12h, timeZone,
      }).format(date);
    }

    function formatTimeHtml(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: use12h, timeZone,
      }).formatToParts(date);
      const digits = parts
        .filter((part) => part.type !== "dayPeriod")
        .map((part) => part.value)
        .join("")
        .trim();
      const dayPeriod = parts.find((part) => part.type === "dayPeriod")?.value;
      return `<span class="time-digits">${digits}</span>${
        dayPeriod ? `<span class="ampm">${dayPeriod}</span>` : ""
      }`;
    }

    function formatPlainTimeHtml(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: use12h, timeZone,
      }).formatToParts(date);
      return parts.map((part) => {
        if (part.type === "dayPeriod") {
          return `<span class="ampm">${part.value}</span>`;
        }
        return part.value;
      }).join("");
    }

    function formatDate(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        year: "numeric", month: "2-digit", day: "2-digit",
        weekday: "short", timeZone,
      }).formatToParts(date);
      const get = (t) => parts.find((p) => p.type === t)?.value ?? "";
      return `${get("year")}-${get("month")}-${get("day")} ${get("weekday")}`;
    }

    function getZonedHMS(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false, timeZone,
      }).formatToParts(date);
      const get = (t) => Number(parts.find((p) => p.type === t)?.value ?? 0);
      let hour = get("hour");
      if (hour === 24) hour = 0;
      return { hour, minute: get("minute"), second: get("second") };
    }

    function getZonedDayProgress(date, timeZone) {
      const { hour, minute, second } = getZonedHMS(date, timeZone);
      return ((hour * 3600 + minute * 60 + second) / 86400) * 100;
    }

    function quoteForDate(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-US", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        timeZone,
      }).formatToParts(date);
      const key = parts
        .filter((part) => part.type !== "literal")
        .map((part) => Number(part.value))
        .reduce((sum, value) => sum + value, 0);
      return dailyQuotes[key % dailyQuotes.length];
    }

    /* ---------- 昼夜阶段 ---------- */
    function phaseInfo(hour) {
      if (hour < 5)  return { icon: "🌙", glow: "rgba(99,102,241,0.35)" };
      if (hour < 8)  return { icon: "🌅", glow: "rgba(245,158,11,0.32)" };
      if (hour < 17) return { icon: "☀️", glow: "rgba(56,189,248,0.32)" };
      if (hour < 19) return { icon: "🌇", glow: "rgba(251,113,133,0.32)" };
      if (hour < 22) return { icon: "🌆", glow: "rgba(124,58,237,0.32)" };
      return { icon: "🌙", glow: "rgba(99,102,241,0.35)" };
    }

    /* ---------- 天空 / 星空 ---------- */
    const sky = document.getElementById("sky");
    const starsEl = document.getElementById("stars");

    function generateStars(n) {
      let html = "";
      for (let i = 0; i < n; i++) {
        const x = (Math.random() * 100).toFixed(2);
        const y = (Math.random() * 100).toFixed(2);
        const dur = (1.5 + Math.random() * 3).toFixed(2);
        const delay = (Math.random() * 4).toFixed(2);
        const size = (Math.random() * 1.6 + 0.8).toFixed(2);
        html += `<span class="star" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s"></span>`;
      }
      starsEl.innerHTML = html;
    }
    generateStars(140);

    // 根据新加坡小时返回天空渐变与星空浓度
    function skyForHour(hour) {
      const palettes = [
        { h: 0,  top: "#06080f", bot: "#0a0f1c", star: 1 },
        { h: 5,  top: "#0a1322", bot: "#1a1822", star: 0.7 },
        { h: 7,  top: "#101a2c", bot: "#2a2420", star: 0.3 },
        { h: 9,  top: "#122238", bot: "#0b182a", star: 0.05 },
        { h: 14, top: "#142a40", bot: "#0c1c30", star: 0 },
        { h: 17, top: "#16203a", bot: "#2a221f", star: 0.2 },
        { h: 19, top: "#11122a", bot: "#1d1720", star: 0.45 },
        { h: 21, top: "#0a1024", bot: "#0e1730", star: 0.8 },
        { h: 24, top: "#06080f", bot: "#0a0f1c", star: 1 },
      ];
      let a = palettes[0], b = palettes[palettes.length - 1];
      for (let i = 0; i < palettes.length - 1; i++) {
        if (hour >= palettes[i].h && hour <= palettes[i + 1].h) {
          a = palettes[i]; b = palettes[i + 1]; break;
        }
      }
      const f = (hour - a.h) / (b.h - a.h || 1);
      const top = lerpColor(a.top, b.top, f);
      const bot = lerpColor(a.bot, b.bot, f);
      const star = a.star + (b.star - a.star) * f;
      return { top, bot, star };
    }

    function lerpColor(c1, c2, f) {
      const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
      const [r1, g1, b1] = p(c1), [r2, g2, b2] = p(c2);
      const r = Math.round(r1 + (r2 - r1) * f);
      const g = Math.round(g1 + (g2 - g1) * f);
      const b = Math.round(b1 + (b2 - b1) * f);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function applySky(hour) {
      if (theme === "light") {
        sky.style.background = "radial-gradient(circle at 50% 0%, #dceefe, #f1f5f9 70%)";
        starsEl.style.opacity = "0";
        return;
      }
      const { top, bot, star } = skyForHour(hour);
      sky.style.background = `radial-gradient(circle at 50% 12%, ${top}, ${bot} 80%)`;
      starsEl.style.opacity = String(star);
    }

    /* ---------- 问候语 ---------- */
    const greetingEl = document.getElementById("greeting");
    function greetingFor(hour) {
      if (hour < 5)  return { icon: "🌙", text: "Late Night" };
      if (hour < 11) return { icon: "🌅", text: "Good Morning" };
      if (hour < 13) return { icon: "☀️", text: "Good Noon" };
      if (hour < 18) return { icon: "🌤️", text: "Good Afternoon" };
      if (hour < 22) return { icon: "🌆", text: "Good Evening" };
      return { icon: "🌙", text: "Late Night" };
    }

    /* ---------- 主题 / 制式按钮 ---------- */
    const themeBtn = document.getElementById("toggle-theme");
    const formatBtn = document.getElementById("toggle-format");
    const worldBtn = document.getElementById("toggle-world");
    const appEl = document.querySelector(".app");

    function applyTheme() {
      document.body.dataset.theme = theme;
      themeBtn.textContent = theme === "dark" ? "🌙 Dark" : "☀️ Light";
    }
    function applyFormat() {
      document.body.dataset.timeFormat = use12h ? "12h" : "24h";
      formatBtn.textContent = use12h ? "🕛 12h" : "🕒 24h";
    }

    function applyWorldVisibility() {
      appEl.classList.toggle("world-hidden", worldHidden);
      worldBtn.textContent = worldHidden ? "🌍 Show" : "🌍 Hide";
    }

    themeBtn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      localStorage.setItem("wc-theme", theme);
      applyTheme();
      render(new Date(), true);
    });
    formatBtn.addEventListener("click", () => {
      use12h = !use12h;
      localStorage.setItem("wc-12h", use12h ? "1" : "0");
      applyFormat();
      render(new Date(), true);
    });
    worldBtn.addEventListener("click", () => {
      worldHidden = !worldHidden;
      localStorage.setItem("wc-world-hidden", worldHidden ? "1" : "0");
      applyWorldVisibility();
    });

    /* ---------- 渲染 ---------- */
    const localLabelEl = document.querySelector(".local .label");
    const localArtEl = document.querySelector(".local-art");
    const localTimeEl = document.getElementById("local-time");
    const localDateEl = document.getElementById("local-date");
    const cityVisualEl = document.getElementById("city-visual");
    const dayNoteEl = document.querySelector(".day-note");
    const dayProgressTextEl = document.getElementById("day-progress-text");
    const dailyQuoteEl = document.getElementById("daily-quote");
    const zonesEl = document.querySelector(".zones");
    const citySearchEl = document.getElementById("city-search");
    const cityOptionsEl = document.getElementById("city-options");
    const addCityBtn = document.getElementById("add-city");
    let cards = Array.from(zonesEl.querySelectorAll(".card"));
    const singaporeArt = localArtEl.innerHTML;
    const artByTz = Object.fromEntries(
      cards.map((card) => [card.dataset.tz, card.querySelector(".bg-art").innerHTML])
    );
    const defaultArt = `
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="xMidYMax meet">
        <circle cx="50" cy="50" r="32"/>
        <path d="M18 50 H82 M50 18 C38 34 38 66 50 82 M50 18 C62 34 62 66 50 82"/>
        <path d="M28 30 C40 38 60 38 72 30 M28 70 C40 62 60 62 72 70"/>
      </svg>
    `;
    const bgArtByVisual = {
      eiffel: `<svg viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="xMidYMax meet"><path d="M50 12 L24 114 M50 12 L76 114"/><path d="M39 42 H61 M32 72 H68 M22 114 H78"/><path d="M36 72 L64 114 M64 72 L36 114"/></svg>`,

    const dailyQuotes = [
      "Make this hour count.",
      "Small moments become the day.",
      "Time moves. You choose the rhythm.",
      "One city, one moment, one breath.",
      "The world is awake somewhere.",
      "Start where you are.",
      "Let this hour be enough.",
      "A quiet minute still matters.",
      "Keep your pace.",
      "Now is a place too.",
    ];

    let liveHeadline = null;
    let liveHeadlines = [];
    let liveHeadlineIndex = -1;
    let liveHeadlineFetchedAt = 0;

    function fallbackQuote(now, timeZone) {
      return quoteForDate(now, timeZone);
    }

    function renderHeadline(now) {
      if (liveHeadline) {
        const title = escapeHtml(liveHeadline.title);
        const url = escapeHtml(liveHeadline.url);
        dailyQuoteEl.innerHTML = url
          ? `<a href="${url}" target="_blank" rel="noreferrer">HN · ${title}</a>`
          : `HN · ${title}`;
        return;
      }
      dailyQuoteEl.textContent = fallbackQuote(now, mainZone.tz);
    }

    async function fetchLiveHeadline() {
      try {
        const topIdsResponse = await fetch("https://hacker-news.firebaseio.com/v0/topstories.json", { cache: "no-store" });
        if (!topIdsResponse.ok) throw new Error("Failed to fetch HN top stories");
        const ids = (await topIdsResponse.json()).slice(0, 30);
        const items = await Promise.all(ids.map(async (id) => {
          try {
            const itemResponse = await fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`, { cache: "no-store" });
            return itemResponse.ok ? itemResponse.json() : null;
          } catch {
            return null;
          }
        }));
        liveHeadlines = items
          .filter((item) => item?.title && !item.deleted && !item.dead)
          .map((item) => ({
            title: item.title,
            url: item.url || `https://news.ycombinator.com/item?id=${item.id}`,
          }));
        rotateLiveHeadline();
      } catch {
        liveHeadline = null;
        renderHeadline(new Date());
      }
    }

    function rotateLiveHeadline() {
      if (!liveHeadlines.length) {
        liveHeadline = null;
        renderHeadline(new Date());
        return;
      }
      liveHeadlineIndex = (liveHeadlineIndex + 1) % liveHeadlines.length;
      liveHeadline = liveHeadlines[liveHeadlineIndex];
      liveHeadlineFetchedAt = Date.now();
      renderHeadline(new Date());
    }

    let mainZone = {
      tz: "Asia/Singapore",
      city: "Singapore",
      shortName: "Singapore",
      art: singaporeArt,
      visual: "merlion",
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    function zoneFromSeed(seed) {
      const display = cityDisplayByTz[seed.tz];
      const city = englishCityName(seed.city ?? display?.city, seed.tz);
      const visual = chooseVisualForCity(city, seed.tz, seed.visual);
      return {
        tz: seed.tz,
        city,
        shortName: englishCityName(seed.shortName ?? city, seed.tz),
        art: bgArtByVisual[visual] ?? seed.art ?? artByTz[seed.tz] ?? defaultArt,
        visual,
      };
    }

    const initialCardZones = Array.from(cards, (card) => zoneFromSeed({
      tz: card.dataset.tz,
      city: card.querySelector(".city").textContent,
      shortName: card.querySelector(".city").textContent.split(" ")[0],
      visual: visualByTz[card.dataset.tz],
    }));

    function loadSavedZones(key, fallback) {
      try {
        const saved = JSON.parse(localStorage.getItem(key) || "null");
        return Array.isArray(saved) ? saved.map(({ art, ...zone }) => zoneFromSeed(zone)) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveListState() {
      const slim = ({ tz, city, shortName, visual }) => ({ tz, city, shortName, visual });
      localStorage.setItem("wc-main-zone", JSON.stringify([slim(mainZone)]));
      localStorage.setItem("wc-card-zones", JSON.stringify(cardZones.map(slim)));
      localStorage.setItem("wc-hidden-zones", JSON.stringify(hiddenZones.map(slim)));
    }

    mainZone = loadSavedZones("wc-main-zone", [mainZone])[0] ?? mainZone;
    let cardZones = loadSavedZones("wc-card-zones", initialCardZones);
    cardZones = cardZones.filter((zone) => zone.tz !== mainZone.tz && isValidTimeZone(zone.tz));
    let hiddenZones = loadSavedZones("wc-hidden-zones", []);

    function syncCardDom() {
      zonesEl.innerHTML = cardZones.map((zone, index) => `
        <div class="card" data-index="${index}" data-tz="${escapeHtml(zone.tz)}" role="button" tabindex="0" draggable="true" aria-label="Switch to ${escapeHtml(zone.city)}">
          <div class="bg-art" aria-hidden="true">${zone.art}</div>
          <div class="card-actions">
            <span class="phase"></span>
            <button class="card-action" type="button" data-action="hide">Hide</button>
          </div>
          <div class="city">${escapeHtml(zone.city)}</div>
          <div class="ctime">--:--:--</div>
          <div class="cdate"></div>
        </div>
      `).join("");
      cards = Array.from(zonesEl.querySelectorAll(".card"));
      bindCardEvents();
    }

    function syncMainDom() {
      localLabelEl.textContent = mainZone.city;
      localArtEl.innerHTML = mainZone.art;
      cityVisualEl.className = `city-visual ${mainZone.visual}`;
      cityVisualEl.innerHTML = pixelVisualTemplates[mainZone.visual] ?? pixelVisualTemplates.mokugyo;
    }

    function swapWithMain(index) {
      const nextMain = cardZones[index];
      cardZones[index] = mainZone;
      mainZone = nextMain;
      syncMainDom();
      syncCardDom();
      render(new Date(), true);
      saveListState();
    }

    function moveCardZone(fromIndex, toIndex) {
      if (fromIndex === toIndex || fromIndex < 0 || toIndex < 0) return;
      const [moved] = cardZones.splice(fromIndex, 1);
      cardZones.splice(toIndex, 0, moved);
      syncCardDom();
      render(new Date(), true);
      saveListState();
    }

    function hideCardZone(index) {
      const [hidden] = cardZones.splice(index, 1);
      if (hidden) hiddenZones.push(hidden);
      syncCardDom();
      render(new Date(), true);
      saveListState();
    }

    function clearDragState() {
      cards.forEach((card) => card.classList.remove("dragging", "drag-over"));
    }

    let dragStartIndex = null;
    let suppressNextClick = false;
    function bindCardEvents() {
      cards.forEach((card) => {
        card.addEventListener("click", (event) => {
          const action = event.target.closest(".card-action")?.dataset.action;
          if (action) {
            event.stopPropagation();
            const index = Number(card.dataset.index);
            if (action === "hide") hideCardZone(index);
            return;
          }
          if (suppressNextClick) {
            suppressNextClick = false;
            return;
          }
          swapWithMain(Number(card.dataset.index));
        });
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            swapWithMain(Number(card.dataset.index));
          }
        });
        card.addEventListener("dragstart", (event) => {
          if (event.target.closest(".card-action")) {
            event.preventDefault();
            return;
          }
          dragStartIndex = Number(card.dataset.index);
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", String(dragStartIndex));
        });
        card.addEventListener("dragenter", (event) => {
          event.preventDefault();
          if (Number(card.dataset.index) !== dragStartIndex) {
            card.classList.add("drag-over");
          }
        });
        card.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
        });
        card.addEventListener("dragleave", () => {
          card.classList.remove("drag-over");
        });
        card.addEventListener("drop", (event) => {
          event.preventDefault();
          const fromIndex = Number(event.dataTransfer.getData("text/plain"));
          const toIndex = Number(card.dataset.index);
          moveCardZone(fromIndex, toIndex);
          suppressNextClick = true;
          clearDragState();
        });
        card.addEventListener("dragend", () => {
          dragStartIndex = null;
          clearDragState();
          setTimeout(() => { suppressNextClick = false; }, 150);
        });
      });
    }

    function optionLabel(option) {
      return `${searchCityName(option.city)} · ${option.tz}`;
    }

    function populateCityOptions() {
      cityOptionsEl.innerHTML = allCityOptions
        .map((option) => `<option value="${escapeHtml(optionLabel(option))}"></option>`)
        .join("");
    }

    function findCityOption(value) {
      const raw = value.trim();
      const lower = raw.toLowerCase();
      const matched = allCityOptions.find((option) => {
        const label = optionLabel(option).toLowerCase();
        const englishName = searchCityName(option.city).toLowerCase();
        return label === lower || englishName === lower || option.city.toLowerCase() === lower || option.tz.toLowerCase() === lower;
      }) ?? allCityOptions.find((option) => optionLabel(option).toLowerCase().includes(lower));
      if (matched) return matched;
      if (raw.includes("/") && isValidTimeZone(raw)) {
        return {
          tz: raw,
          city: timeZoneToCity(raw),
          shortName: raw.split("/").pop().replaceAll("_", " "),
          visual: visualByTz[raw] ?? "circuit",
        };
      }
      return null;
    }

    function isValidTimeZone(tz) {
      try {
        new Intl.DateTimeFormat("en-US", { timeZone: tz }).format(new Date());
        return true;
      } catch {
        return false;
      }
    }

    function addCityFromSearch() {
      const option = findCityOption(citySearchEl.value);
      if (!option) return;
      const alreadyVisible = cardZones.some((zone) => zone.tz === option.tz) || mainZone.tz === option.tz;
      if (alreadyVisible) {
        citySearchEl.value = "";
        return;
      }
      const zone = zoneFromSeed(option);
      hiddenZones = hiddenZones.filter((hidden) => hidden.tz !== zone.tz);
      cardZones.push(zone);
      citySearchEl.value = "";
      syncCardDom();
      render(new Date(), true);
      saveListState();
    }

    addCityBtn.addEventListener("click", addCityFromSearch);
    citySearchEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        addCityFromSearch();
      }
    });
    populateCityOptions();

    function render(now, force) {
      // 本地
      localTimeEl.innerHTML = formatTimeHtml(now, mainZone.tz);
      localDateEl.textContent = formatDate(now, mainZone.tz);
      const dayProgress = getZonedDayProgress(now, mainZone.tz);
      dayProgressTextEl.textContent = `Today ${dayProgress.toFixed(1)}%`;
      dayNoteEl.style.setProperty("--progress", `${dayProgress}%`);
      renderHeadline(now);

      const localHour = getZonedHMS(now, mainZone.tz).hour;
      const g = greetingFor(localHour);
      greetingEl.innerHTML = `<span class="emoji">${g.icon}</span><span>${g.text}!</span><span class="greeting-city">${mainZone.shortName}</span>`;
      applySky(localHour);

      // 各城市
      cards.forEach((card) => {
        const tz = card.dataset.tz;
        card.querySelector(".ctime").innerHTML = formatPlainTimeHtml(now, tz);
        card.querySelector(".cdate").textContent = formatDate(now, tz);
        const ph = phaseInfo(getZonedHMS(now, tz).hour);
        card.querySelector(".phase").textContent = ph.icon;
        card.style.setProperty("--glow", ph.glow);
      });
    }

    function renderVisualGallery() {
      const coreZones = [
        { city: "Singapore", shortName: "Singapore", tz: "Asia/Singapore", visual: "merlion" },
        { city: "New York", shortName: "New York", tz: "America/New_York", visual: "torch" },
        { city: "San Jose", shortName: "San Jose", tz: "America/Los_Angeles", visual: "circuit" },
        { city: "London", shortName: "London", tz: "Europe/London", visual: "bigben" },
        { city: "Tokyo", shortName: "Tokyo", tz: "Asia/Tokyo", visual: "tokyo" },
      ];
      const galleryZones = [...coreZones, ...commonCityZones]
        .map(zoneFromSeed)
        .filter((zone, index, zones) => (
          zones.findIndex((item) => item.city === zone.city && item.visual === zone.visual) === index
        ));

      document.body.innerHTML = `
        <div id="sky" style="background: radial-gradient(circle at 50% 12%, #10203f, #07101f 80%)"></div>
        <div id="stars"></div>
        <main class="visual-gallery">
          <h1>City Visuals</h1>
          <p>All curated city visuals currently supported by this clock.</p>
          <section class="visual-grid">
            ${galleryZones.map((zone) => `
              <article class="visual-tile">
                <div class="city-visual ${escapeHtml(zone.visual)}">${pixelVisualTemplates[zone.visual] ?? pixelVisualTemplates.circuit}</div>
                <div class="visual-city">${escapeHtml(zone.city)}</div>
                <div class="visual-meta">${escapeHtml(zone.visual)} · ${escapeHtml(zone.tz)}</div>
              </article>
            `).join("")}
          </section>
        </main>
      `;
    }

    let lastSecond = -1;
    function loop() {
      const now = new Date();
      if (now.getSeconds() !== lastSecond) {
        lastSecond = now.getSeconds();
        render(now);
      }
      requestAnimationFrame(loop);
    }

    applyTheme();
    applyFormat();
    applyWorldVisibility();
    syncMainDom();
    syncCardDom();
    render(new Date(), true);
    fetchLiveHeadline();
    setInterval(rotateLiveHeadline, 2 * 60 * 1000);
    setInterval(fetchLiveHeadline, 10 * 60 * 1000);
    loop();
    if (new URLSearchParams(location.search).get("gallery") === "1") {
      renderVisualGallery();
    }
  </script>
</body>
</html>
